[versions]
# SDK
appId = "tv.projectivy.plugin.wallpaperprovider.sample"
compileSdk = "37"
minSdk = "23"
targetSdk = "37"
versionCode = "3"
versionName = "1.10"

# Kotlin
kotlin = "2.3.21"

# Android Gradle Plugin
agp = "9.2.0"

# Core AndroidX
core = "1.19.0-alpha01"
appcompat = "1.8.0-alpha01"
preference = "1.2.1"
annotation = "1.10.0"

# Material
material = "1.14.0-beta01"

# Kotlinx
serializationJson = "1.11.0"

# Leanback
leanback = "1.2.0"

# OkHttp
okhttp = "5.1.0"

[libraries]

androidx-leanback = { module = "androidx.leanback:leanback", version.ref = "leanback" }

androidx-preference-ktx = { module = "androidx.preference:preference-ktx", version.ref = "preference" }

kotlin-bom = { group = "org.jetbrains.kotlin", name = "kotlin-bom", version.ref = "kotlin" }

# Kotlinx
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serializationJson" }

# Core AndroidX
androidx-core = { group = "androidx.core", name = "core", version.ref = "core" }

androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }

androidx-annotation = { group = "androidx.annotation", name = "annotation", version.ref = "annotation" }

# Material
google-material = { group = "com.google.android.material", name = "material", version.ref = "material" }

# OkHttp
okhttp-bom = { module = "com.squareup.okhttp3:okhttp-bom", version.ref = "okhttp" }
okhttp = { module = "com.squareup.okhttp3:okhttp" }

[plugins]

android-application = { id = "com.android.application", version.ref = "agp" }

android-library = { id = "com.android.library", version.ref = "agp" }

kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }

kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }

kotlin-parcelize = { id = "org.jetbrains.kotlin.plugin.parcelize", version.ref = "kotlin" }